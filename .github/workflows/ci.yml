name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the tests against the real arXiv, PubMed and OpenAlex services"
        type: boolean
        default: false

concurrency:  # a newer push to the same branch cancels the run it replaces
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,pdf,llm]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  minimum-versions:
    # The oldest dependency versions pyproject.toml allows, so its lower bounds stay true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -c ci/minimum-versions.txt -e ".[dev,llm]"
      - run: pytest

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m live -v
        env:
          INFORMATICS_LIVE: "1"
          INFORMATICS_RECORD_DIR: recorded
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-records
          path: recorded/
          if-no-files-found: ignore
