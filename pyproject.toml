[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "informatics"
version = "0.1.0"
description = "Harvest arXiv metadata, select AI-in-medicine papers, and analyse their phrases, topics and themes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "simplemma>=1.0",
]

[project.optional-dependencies]
# Sentence embeddings for clustering (informatics embed / analyze --embeddings)
embeddings = ["sentence-transformers>=2.2"]
# Language-model classification (informatics classify --method llm)
llm = ["anthropic>=1.0"]
# Only needed for misc/pdf_extract.py
pdf = ["pypdf>=4.0", "pdfminer.six>=20231228"]
dev = ["pytest>=8", "ruff==0.17.3", "pyyaml>=6"]

[project.scripts]
informatics = "informatics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
informatics = ["report_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
